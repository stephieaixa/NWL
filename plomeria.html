<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plomería Básica — SkillForge</title>
<style>
:root{
  --bg:#181614;--sur:#201e1b;--sur2:#272420;--sur3:#2e2b26;
  --brd:#3a3630;--brd2:#4a4640;
  --txt:#e0d8cc;--txt2:#a09080;--txt3:#706050;
  --acc:#e8a030;--grn:#44bb66;--red:#cc4433;--blu:#4488cc;
  --water:#5599ee;--chrome:#9aacb0;
  --mono:'Courier New',monospace;--ui:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:13px;min-height:100vh;padding-bottom:250px;}

/* HEADER */
.hdr{display:flex;align-items:center;height:36px;background:#100e0c;border-bottom:1px solid var(--brd);padding:0 10px;gap:8px;flex-wrap:wrap;}
.hdr-back{font-size:11px;color:var(--txt3);text-decoration:none;padding:3px 8px;border-radius:3px;border:1px solid var(--brd);transition:all .15s;white-space:nowrap;}
.hdr-back:hover{color:var(--txt2);border-color:var(--brd2);}
.hdr-title{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.5px;}
.hdr-sub{font-size:10px;color:var(--txt3);}
.sc-tabs{display:flex;gap:4px;margin-left:auto;}
.sc-tab{padding:3px 10px;border-radius:3px;cursor:pointer;font-size:10px;border:1px solid var(--brd);color:var(--txt3);background:transparent;transition:all .12s;letter-spacing:.3px;white-space:nowrap;}
.sc-tab.on{background:rgba(232,160,48,.12);border-color:var(--acc);color:var(--acc);}
.sc-tab:hover{color:var(--txt2);}

/* FLASH / XP */
#xpp{position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-8px);background:#120e00;border:1px solid var(--acc);border-radius:4px;padding:5px 16px;font-size:11px;color:var(--acc);opacity:0;transition:all .35s;z-index:500;pointer-events:none;}
#xpp.show{opacity:1;transform:translateX(-50%) translateY(0);}
.flash{position:fixed;inset:0;pointer-events:none;z-index:400;opacity:0;transition:opacity .28s;background:rgba(232,160,48,.05);}
.flash.on{opacity:1;}

/* FEEDBACK TOAST */
#fb{position:fixed;top:46px;left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:5px;font-size:11px;opacity:0;transition:all .3s;z-index:600;pointer-events:none;text-align:center;max-width:85vw;border:1px solid;}
#fb.show{opacity:1;}
#fb.ok{background:#081a10;border-color:var(--grn);color:#88ee99;}
#fb.err{background:#1a0808;border-color:var(--red);color:#ff9988;}
#fb.tip{background:#12100a;border-color:var(--acc);color:#e0c080;}

/* SCENE */
.scene-wrap{position:relative;overflow:hidden;background:#1a1714;border-bottom:2px solid var(--brd2);}
#scene-svg{display:block;width:100%;max-height:300px;}

/* SELECTED TOOL CURSOR INDICATOR */
#tool-cursor{position:fixed;top:0;left:0;pointer-events:none;z-index:700;font-size:22px;transform:translate(8px,8px);display:none;}

/* BOTTOM PANEL */
#bottom{position:fixed;bottom:0;left:0;right:0;background:#141210;border-top:2px solid var(--brd2);z-index:200;display:flex;flex-direction:column;max-height:260px;}

/* INVENTORY */
.inv{display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0;min-height:58px;}
.inv-lbl{font-size:8px;color:var(--txt3);letter-spacing:1px;white-space:nowrap;margin-right:6px;text-transform:uppercase;}
.inv-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 7px;border-radius:4px;cursor:pointer;border:1px solid var(--brd);background:transparent;transition:all .15s;min-width:50px;flex-shrink:0;}
.inv-item:hover{border-color:var(--brd2);background:var(--sur3);}
.inv-item.sel{border-color:var(--acc);background:rgba(232,160,48,.13);box-shadow:0 0 0 1px var(--acc);}
.inv-item.used{opacity:.3;cursor:default;pointer-events:none;}
.inv-icon{font-size:20px;line-height:1;}
.inv-name{font-size:7px;color:var(--txt3);text-align:center;line-height:1.2;}
.inv-item.sel .inv-name{color:var(--acc);}
.inv-deselect{padding:4px 8px;font-size:9px;color:var(--txt3);border:1px solid var(--brd);border-radius:3px;cursor:pointer;display:none;transition:all .12s;flex-shrink:0;}
.inv-deselect:hover{color:var(--txt2);}

/* MISSION PANEL */
.mp{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.mp-head{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--sur2);border-bottom:1px solid var(--brd);cursor:pointer;flex-shrink:0;}
.mp-ico{font-size:13px;}
.mp-title{font-size:11px;font-weight:700;color:#fff;flex:1;}
.mp-xp{font-size:10px;color:var(--acc);font-weight:700;}
.mp-tog{font-size:10px;color:var(--txt3);}
.mp-tabs{display:flex;border-bottom:1px solid var(--brd);flex-shrink:0;}
.mp-tab{flex:1;padding:4px;text-align:center;cursor:pointer;font-size:9px;letter-spacing:.5px;color:var(--txt3);border-bottom:2px solid transparent;transition:all .15s;}
.mp-tab.on{color:#fff;border-bottom-color:var(--acc);}
.mp-tab:hover{color:var(--txt2);}
.mp-body{flex:1;overflow-y:auto;padding:8px 12px;font-size:9px;line-height:1.5;}
.mp-obj{color:var(--txt2);margin-bottom:6px;line-height:1.5;}
.mp-steps{list-style:none;margin-bottom:8px;}
.mp-step{display:flex;gap:6px;padding:3px 0;color:var(--txt3);}
.mp-step.cur{color:#fff;}
.mp-step.done{color:var(--grn);text-decoration:line-through;}
.mp-step-ic{flex-shrink:0;width:12px;text-align:center;}
.mp-tip{font-size:8px;color:#7090a8;border-left:2px solid #3a5060;padding:4px 8px;margin-bottom:6px;line-height:1.5;font-style:italic;}
.mp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.mp-btn{padding:4px 10px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:1px;border:1px solid;transition:all .15s;text-transform:uppercase;}
.mp-btn.ok{border-color:var(--grn);color:var(--grn);background:rgba(68,187,102,.08);}
.mp-btn.ok:hover{background:var(--grn);color:#000;}
.mp-btn.skip{border-color:#333;color:var(--txt3);background:transparent;}
.mp-btn.hint{border-color:#554400;color:#aa9900;background:rgba(160,130,0,.07);}
.mp-btn.hint:hover{background:rgba(180,150,0,.18);color:#ddbb00;}
.mp-prog{border-top:1px solid var(--brd);padding:3px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mp-bar{flex:1;height:2px;background:#201c18;border-radius:2px;overflow:hidden;}
.mp-fill{height:100%;background:linear-gradient(90deg,var(--acc),#ffcc66);transition:width .5s;}
.mp-pt{font-size:8px;color:var(--txt3);}

/* CRISIS / TIPS */
.crisis-item{background:var(--sur2);border:1px solid var(--brd);border-radius:3px;padding:8px;margin-bottom:6px;}
.crisis-q{font-size:9px;font-weight:700;color:#cc8833;margin-bottom:3px;}
.crisis-a{font-size:8px;color:var(--txt2);line-height:1.5;margin-bottom:3px;}
.crisis-steps{list-style:none;padding-left:6px;}
.crisis-steps li{font-size:8px;color:var(--txt3);padding:1px 0;}
.crisis-steps li::before{content:'→ ';}
.tip-item{border-left:2px solid var(--acc);padding:5px 8px;margin-bottom:5px;}
.tip-tag{font-size:8px;font-weight:700;color:var(--acc);letter-spacing:1px;margin-bottom:2px;}
.tip-txt{font-size:8px;color:var(--txt2);line-height:1.5;}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:145px;}
.chat-chips{display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px;}
.chat-chip{padding:2px 7px;border-radius:10px;font-size:8px;cursor:pointer;border:1px solid var(--brd);color:var(--txt3);transition:all .12s;}
.chat-chip:hover{border-color:var(--acc);color:var(--acc);}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:3px;}
.chat-msg{max-width:90%;padding:4px 7px;border-radius:4px;font-size:9px;line-height:1.5;word-break:break-word;}
.chat-msg.bot{background:#1a1e28;color:#a0b8d0;align-self:flex-start;border:1px solid #253040;}
.chat-msg.user{background:#1e1a10;color:#c0a860;align-self:flex-end;border:1px solid #352808;}
.chat-msg.typing{color:#5a7888;font-style:italic;}
.chat-row{display:flex;gap:4px;padding:4px 8px;border-top:1px solid var(--brd);}
.chat-input{flex:1;background:#111;border:1px solid var(--brd);border-radius:3px;color:var(--txt);font-size:9px;padding:3px 6px;font-family:var(--ui);outline:none;}
.chat-input:focus{border-color:var(--acc);}
.chat-send{padding:3px 9px;border-radius:3px;cursor:pointer;font-size:9px;font-weight:700;background:rgba(232,160,48,.12);border:1px solid #4a3010;color:var(--acc);transition:all .15s;}
.chat-send:hover{background:rgba(232,160,48,.22);}

@keyframes drip{
  0%{transform:translateY(0) scaleY(.5);opacity:0;}
  15%{opacity:1;transform:translateY(2px) scaleY(1);}
  80%{opacity:.9;}
  100%{transform:translateY(38px) scaleY(1.4);opacity:0;}
}
@keyframes drip2{
  0%,40%{transform:translateY(0) scaleY(.5);opacity:0;}
  55%{opacity:1;transform:translateY(2px) scaleY(1);}
  95%,100%{transform:translateY(32px) scaleY(1.4);opacity:0;}
}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}
@keyframes hintBlink{0%,100%{box-shadow:0 0 0 0 rgba(255,200,0,.9);}50%{box-shadow:0 0 0 8px rgba(255,200,0,0);}}
.drip-1{animation:drip 1.6s ease-in infinite;}
.drip-2{animation:drip2 1.6s ease-in infinite;}
.hint-pulse{animation:hintBlink .8s ease-in-out 5 !important;outline:2px solid rgba(255,200,0,.8) !important;z-index:10;position:relative;}
.clickzone{cursor:pointer;fill:transparent;}
.clickzone:hover{fill:rgba(232,160,48,.10);}
</style>
</head>
<body>

<div id="xpp"></div>
<div class="flash" id="fl"></div>
<div id="fb"></div>
<div id="tool-cursor"></div>

<!-- HEADER -->
<div class="hdr">
  <a href="index.html" class="hdr-back">← Inicio</a>
  <span class="hdr-title">🚰 Plomería</span>
  <span class="hdr-sub">SkillForge Hogar</span>
  <div class="sc-tabs">
    <div class="sc-tab on" id="sctab-0" onclick="loadScenario(0)">Canilla gotea</div>
    <div class="sc-tab" id="sctab-1" onclick="loadScenario(1)">Desagüe tapado</div>
    <div class="sc-tab" id="sctab-2" onclick="loadScenario(2)">Llave general</div>
  </div>
</div>

<!-- SCENE -->
<div class="scene-wrap">
  <svg id="scene-svg" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<!-- BOTTOM PANEL -->
<div id="bottom">
  <!-- INVENTORY -->
  <div class="inv" id="inv-bar">
    <span class="inv-lbl">🧰 Herramientas</span>
  </div>
  <!-- MISSION -->
  <div class="mp">
    <div class="mp-head" onclick="toggleMP()">
      <span class="mp-ico" id="mp-ico">🔧</span>
      <span class="mp-title" id="mp-t">Cargando...</span>
      <span class="mp-xp" id="mp-xp">0 XP</span>
      <span class="mp-tog" id="mp-tog">▼</span>
    </div>
    <div class="mp-tabs">
      <div class="mp-tab on" id="tab-mis" onclick="setTab('mis')">MISIÓN</div>
      <div class="mp-tab" id="tab-cri" onclick="setTab('cri')">🚨 CRISIS</div>
      <div class="mp-tab" id="tab-tip" onclick="setTab('tip')">💡 TIPS</div>
      <div class="mp-tab" id="tab-ast" onclick="setTab('ast')">🤖 CHAT</div>
    </div>
    <div class="mp-body" id="mp-body"></div>
    <div class="mp-prog">
      <div class="mp-bar"><div class="mp-fill" id="mp-fill" style="width:0%"></div></div>
      <div class="mp-pt" id="mp-pt">0/0</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════

const SCENARIOS = [
{
  id:'canilla',
  title:'La canilla gotea',
  ico:'🚰',
  totalSteps:8,
  inventory:[
    {id:'llave',icon:'🔧',name:'Llave inglesa'},
    {id:'destornillador',icon:'🪛',name:'Destornillador'},
    {id:'destPlano',icon:'🪛',name:'Dest. plano'},
    {id:'arandela',icon:'⭕',name:'Arandela nueva'},
    {id:'trapo',icon:'🧻',name:'Trapo/balde'},
  ],
  steps:[
    {txt:'Cerrá la llave de paso bajo el lavabo',
     tool:'llave',target:'valve',
     tip:'La llave de paso corta el agua de esa canilla específica. Girá en sentido horario hasta que no gire más. Si no hay llave de paso, cerrá la llave general.',
     wrongTool:'Necesitás la llave inglesa para girar la llave de paso.',
     wrongTarget:'La llave de paso está abajo del lavabo, en la cañería.',
     hintEl:'zone-valve'},
    {txt:'Abrí la canilla para liberar la presión residual',
     tool:null,target:'handle',
     tip:'Aunque cortaste el agua, queda presión en la cañería. Al abrir la canilla, esa presión se libera y el agua que quedaba en la tubería sale. Así trabajás sin salpicaduras.',
     wrongTarget:'Primero cortá el agua, después abrí la canilla.',
     hintEl:'zone-handle'},
    {txt:'Quitá la tapa decorativa y el tornillo del mango',
     tool:'destornillador',target:'handle',
     tip:'La mayoría de las canillas tiene una tapa plástica que esconde el tornillo central. Levantala con el destornillador plano, después desatornillá el tornillo Phillips de adentro.',
     wrongTool:'Necesitás un destornillador para quitar el tornillo del mango.',
     wrongTarget:'Hacé clic en el mango de la canilla para desmontarlo.',
     hintEl:'zone-handle'},
    {txt:'Extraé el cartucho/vástago de la canilla',
     tool:null,target:'stem',
     tip:'El cartucho es el mecanismo interno que controla el agua. En canillas viejas es un vástago con una arandela de goma. En canillas modernas es un cartucho cerámico de un solo bloque.',
     wrongTarget:'Hacé clic en el cartucho expuesto para extraerlo.',
     hintEl:'zone-stem'},
    {txt:'Sacá la arandela vieja del cartucho',
     tool:'destPlano',target:'washer',
     tip:'La arandela de goma es lo que sella el agua. Con el tiempo se endurece, se aplana o se agrieta. Ese deterioro es la causa del 90% de las goteras en canillas viejas.',
     wrongTool:'Usá el destornillador plano para hacer palanca y sacar la arandela.',
     wrongTarget:'Hacé clic en la arandela vieja del cartucho para quitarla.',
     hintEl:'zone-washer'},
    {txt:'Colocá la arandela nueva',
     tool:'arandela',target:'stem',
     tip:'La arandela nueva tiene que ser del mismo tamaño que la vieja. Llevá la vieja al ferretería como muestra. Algunas canillas usan O-rings en vez de arandelas planas — son intercambiables si son del mismo diámetro.',
     wrongTool:'Seleccioná la arandela nueva del inventario y colocala en el cartucho.',
     wrongTarget:'Hacé clic en el cartucho para colocar la arandela nueva.',
     hintEl:'zone-stem'},
    {txt:'Volvé a armar la canilla',
     tool:null,target:'faucet',
     tip:'Al reensamblar: primero el cartucho, después la tuerca empaquetadora, después el mango, después el tornillo, después la tapa. El orden inverso al desarme.',
     wrongTarget:'Hacé clic en la canilla para volver a armarla.',
     hintEl:'zone-faucet'},
    {txt:'Abrí la llave de paso y probá',
     tool:'llave',target:'valve',
     tip:'Abrí lentamente. Fijate si hay pérdida alrededor del cuerpo de la canilla al abrir el agua — si hay, la tuerca empaquetadora no está bien apretada. Si la canilla no gotea: ¡misión cumplida!',
     wrongTool:'Usá la llave inglesa para abrir la llave de paso.',
     wrongTarget:'Abrí la llave de paso debajo del lavabo.',
     hintEl:'zone-valve'},
  ],
},
{
  id:'desague',
  title:'Desagüe tapado',
  ico:'🪠',
  totalSteps:6,
  inventory:[
    {id:'ventosa',icon:'🪠',name:'Destapador'},
    {id:'llave_sifon',icon:'🔧',name:'Llave sifón'},
    {id:'limpiador',icon:'🧴',name:'Agua caliente'},
    {id:'trapo',icon:'🧻',name:'Trapo'},
  ],
  steps:[
    {txt:'Probá con agua muy caliente primero',
     tool:'limpiador',target:'basin',
     tip:'El 40% de los tapones son grasa acumulada. Agua hirviendo + detergente la disuelve sin romper nada. Siempre empezá por el método más simple antes de desarmar.',
     wrongTool:'Seleccioná "Agua caliente" del inventario y aplicala al desagüe.',
     wrongTarget:'Aplicá agua caliente directamente al desagüe del lavabo.',
     hintEl:'zone-basin'},
    {txt:'Usá el destapador con movimientos firmes',
     tool:'ventosa',target:'drain',
     tip:'El destapador crea presión y vacío alternativamente. Sellá bien el desagüe antes de bombear. Si el lavabo tiene rebosadero, taponalo con un trapo para que la presión vaya hacia el tapón.',
     wrongTool:'Seleccioná el destapador y usalo en el desagüe.',
     wrongTarget:'Usá el destapador en el orificio del desagüe.',
     hintEl:'zone-drain'},
    {txt:'Poné un balde bajo el sifón antes de abrirlo',
     tool:'trapo',target:'bucket_area',
     tip:'El sifón siempre tiene agua (es su función: forma un sello hidráulico que impide que suban los gases de la cañería). Al abrirlo, ese agua cae. El balde evita el desastre.',
     wrongTool:'Colocá el trapo/balde bajo el sifón.',
     wrongTarget:'Colocá el balde bajo el sifón.',
     hintEl:'zone-bucket'},
    {txt:'Desenroscá el sifón',
     tool:'llave_sifon',target:'sifon',
     tip:'En sifones de PVC podés girar a mano. En sifones de metal o muy viejos usás la llave. Girá en sentido antihorario. Si no cede: no fuerces — buscá la dirección correcta.',
     wrongTool:'Usá la llave del sifón para abrirlo.',
     wrongTarget:'Hacé clic en el sifón para desenroscarlo.',
     hintEl:'zone-sifon'},
    {txt:'Limpiá el sifón y la cañería',
     tool:'trapo',target:'sifon',
     tip:'El sifón acumula grasa, pelo y residuos. Limpialo con un trapo viejo. Si la obstrucción está más adentro en la cañería, usá un destapa-cañerías (espiral flexible) para alcanzarla.',
     wrongTool:'Usá el trapo para limpiar el sifón.',
     wrongTarget:'Limpiá el interior del sifón.',
     hintEl:'zone-sifon'},
    {txt:'Volvé a armar el sifón y probá',
     tool:null,target:'sifon',
     tip:'Apretá el sifón a mano + un cuarto de vuelta con la llave. No más — el PVC se puede craquear. Abrí el agua lentamente y mirá si hay pérdida en las uniones.',
     wrongTarget:'Rosca el sifón de vuelta en su lugar.',
     hintEl:'zone-sifon'},
  ],
},
{
  id:'emergencia',
  title:'Llave general de paso',
  ico:'🆘',
  totalSteps:5,
  inventory:[
    {id:'llave',icon:'🔧',name:'Llave inglesa'},
    {id:'linterna',icon:'🔦',name:'Linterna'},
  ],
  steps:[
    {txt:'Localizá el medidor y la llave general',
     tool:'linterna',target:'meter',
     tip:'En edificios: sala de medidores en planta baja o subsuelo, o dentro del departamento en un armario. En casas: frente de la propiedad, bajo tierra, en una caja de la vereda. Buscá la tapa con el símbolo del agua.',
     wrongTool:'Usá la linterna para iluminar y encontrar el medidor.',
     wrongTarget:'Buscá el medidor de agua con la linterna.',
     hintEl:'zone-meter'},
    {txt:'Identificá la llave de paso principal',
     tool:null,target:'main_valve',
     tip:'Son dos tipos: a) mariposa/palanca → paralela a la cañería = abierta, perpendicular = cerrada. b) esfera/globo (rueda) → muchas vueltas hasta cerrar. Identificá cuál tenés.',
     wrongTarget:'Identificá la llave de paso principal en el medidor.',
     hintEl:'zone-main_valve'},
    {txt:'Cerrá la llave general',
     tool:'llave',target:'main_valve',
     tip:'Palanca: girá 90° hasta quedar perpendicular a la cañería. Esfera/globo: girá en sentido horario hasta que no gire más. En emergencias de inundación: primero cerrás el agua, DESPUÉS buscás la causa.',
     wrongTool:'Usá la llave inglesa para cerrar la llave general.',
     wrongTarget:'Cerrá la llave principal de paso.',
     hintEl:'zone-main_valve'},
    {txt:'Verificá que no sale agua en ningún grifo',
     tool:null,target:'test_tap',
     tip:'Abrí una canilla en el punto más alto de la vivienda. Si sigue saliendo agua, la llave no cerró bien o hay otra entrada de agua. En edificios, el agua de los vecinos del piso superior puede seguir saliendo unos segundos.',
     wrongTarget:'Probá abriendo una canilla para verificar que no hay agua.',
     hintEl:'zone-test_tap'},
    {txt:'Llamá al plomero o corregí el problema',
     tool:null,target:'phone',
     tip:'Con el agua cortada tenés tiempo para actuar sin pánico. Para emergencias 24h buscá un plomero de guardia. Para pérdidas menores podés esperar al día siguiente. Siempre anotá dónde está tu llave general — es info de emergencia.',
     wrongTarget:'Hacé clic en el teléfono para llamar al plomero.',
     hintEl:'zone-phone'},
  ],
},
];

const CRISIS = [
  {q:'Abrí la canilla y no para de salir agua',

function buildTiles(x,y,w,h,tw,th,c1,c2){
  let s='';
  for(let r=0;r*th<h;r++){
    for(let c=0;c*tw<w;c++){
      const fill=(r+c)%2===0?c1:c2;
      s+=`<rect x="${x+c*tw}" y="${y+r*th}" width="${tw-1}" height="${th-1}" fill="${fill}" rx="1"/>`;
    }
  }
  return s;
}

function renderScene(){
  const svg=document.getElementById('scene-svg');
  const sc=SCENARIOS[scn];
  if(scn===0)      svg.innerHTML=sceneFaucet(stp);
  else if(scn===1) svg.innerHTML=sceneDrain(stp);
  else             svg.innerHTML=sceneEmergency(stp);
}

// ══════════════════════════════════════════════
// INVENTORY
// ══════════════════════════════════════════════
function renderInventory(){
  const sc=SCENARIOS[scn];
  const bar=document.getElementById('inv-bar');
  bar.innerHTML=`<span class="inv-lbl">🧰 Herramientas</span>`;
  sc.inventory.forEach(it=>{
    const d=document.createElement('div');
    d.className='inv-item'+(sel===it.id?' sel':'');
    d.id='inv-'+it.id;
    d.innerHTML=`<span class="inv-icon">${it.icon}</span><span class="inv-name">${it.name}</span>`;
    d.onclick=()=>selectTool(it.id);
    bar.appendChild(d);
  });
  if(sel){
    const btn=document.createElement('div');
    btn.className='inv-deselect';
    btn.style.display='block';
    btn.textContent='✕ Soltar';
    btn.onclick=()=>selectTool(null);
    bar.appendChild(btn);
  }
  const cur=document.getElementById('tool-cursor');
  if(sel){
    const it=sc.inventory.find(i=>i.id===sel);
    cur.textContent=it?it.icon:'';
    cur.style.display='block';
    document.onmousemove=e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';};
  } else {
    cur.style.display='none';
    document.onmousemove=null;
  }
}

function selectTool(id){
  sel=id===sel?null:id;
  renderInventory();
  if(sel){
    const it=SCENARIOS[scn].inventory.find(i=>i.id===sel);
    toast(`Seleccionado: ${it.icon} ${it.name} — ahora hacé clic en el elemento correcto`,0);
  } else {
    clearToast();
  }
}

// ══════════════════════════════════════════════
// INTERACTION
// ══════════════════════════════════════════════
function clickZone(zone){
  const sc=SCENARIOS[scn];
  if(stp>=sc.steps.length) return;
  const step=sc.steps[stp];

  // Check if correct zone
  if(zone!==step.target){
    toast(step.wrongTarget||'Eso no es lo que necesitás ahora. Revisá el paso actual.','err');
    return;
  }

  // Check if correct tool (if required)
  if(step.tool&&sel!==step.tool){
    toast(step.wrongTool||`Necesitás usar la herramienta correcta primero.`,'err');
    return;
  }

  // Advance
  stp++;
  sel=null;
  flash();
  xpPop(25,'Paso completado');

  if(stp>=sc.steps.length){
    // Scenario complete
    xp+=sc.totalSteps*25+100;
    xpPop(100,'¡Escenario completado!');
    toast(`¡Excelente! Completaste "${sc.title}". +${sc.totalSteps*25+100} XP total`,'ok');
    setTimeout(()=>{
      renderScene();
      renderMP();
    },400);
  } else {
    renderScene();
    renderInventory();
    renderMP();
    toast(step.tip,'tip');
  }
}

// ══════════════════════════════════════════════
// MISSION PANEL
// ══════════════════════════════════════════════
function renderMP(){
  const sc=SCENARIOS[scn];
  const done=stp>=sc.steps.length;
  document.getElementById('mp-ico').textContent=done?'✅':sc.ico;
  document.getElementById('mp-t').textContent=done?sc.title+' — COMPLETADO':sc.title;
  document.getElementById('mp-xp').textContent=xp+' XP';
  document.getElementById('mp-fill').style.width=(Math.min(stp,sc.totalSteps)/sc.totalSteps*100)+'%';
  document.getElementById('mp-pt').textContent=Math.min(stp,sc.totalSteps)+'/'+sc.totalSteps;
  if(mpTab==='mis') renderMisTab();
  else if(mpTab==='cri') renderCriTab();
  else if(mpTab==='tip') renderTipTab();
  else renderChatTab();
}

function renderMisTab(){
  const sc=SCENARIOS[scn];
  const body=document.getElementById('mp-body');
  if(stp>=sc.steps.length){
    body.innerHTML=`<div style="text-align:center;padding:14px 8px">
      <div style="font-size:26px;margin-bottom:6px">🏆</div>
      <div style="font-size:14px;color:var(--acc);letter-spacing:2px;font-family:var(--ui);font-weight:700">COMPLETADO</div>
      <div style="font-size:8px;color:var(--txt3);margin-top:5px">XP: <span style="color:var(--acc)">${xp}</span></div>
      <button class="mp-btn ok" style="margin-top:12px" onclick="loadScenario(${(scn+1)%SCENARIOS.length})">Siguiente escenario →</button>
    </div>`;
    return;
  }
  const step=sc.steps[stp];
  const stepsHtml=sc.steps.map((s,i)=>{
    const done=i<stp, cur=i===stp;
    return `<li class="mp-step ${done?'done':cur?'cur':''}">
      <span class="mp-step-ic">${done?'✓':'·'}</span>
      <span>${s.txt}</span>
    </li>`;
  }).join('');

  body.innerHTML=`
    <div class="mp-obj">${step.txt}${step.tool?` — <span style="color:var(--acc)">Herramienta: ${SCENARIOS[scn].inventory.find(i=>i.id===step.tool)?.icon||''} ${SCENARIOS[scn].inventory.find(i=>i.id===step.tool)?.name||''}</span>`:''}</div>
    <ul class="mp-steps">${stepsHtml}</ul>
    <div class="mp-actions">
      ${stp>0?`<button class="mp-btn skip" onclick="prevStep()">← Ant.</button>`:''}
      <button class="mp-btn hint" onclick="doHint()" style="animation:hintBlink 1.4s ease-in-out infinite">💡 Hint</button>
      <button class="mp-btn skip" onclick="nextStep()">Saltar →</button>
    </div>`;
}

function renderCriTab(){
  document.getElementById('mp-body').innerHTML=`<div>${
    CRISIS.map(c=>`<div class="crisis-item">
      <div class="crisis-q">⚠ ${c.q}</div>
      <div class="crisis-a">${c.a}</div>
      <ul class="crisis-steps">${c.steps.map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>`).join('')
  }</div>`;
}

function renderTipTab(){
  document.getElementById('mp-body').innerHTML=`<div>${
    TIPS.map(t=>`<div class="tip-item" style="border-left-color:${t.acc}">
      <div class="tip-tag" style="color:${t.acc}">${t.tag}</div>
      <div class="tip-txt">${t.txt}</div>
    </div>`).join('')
  }</div>`;
}

// ══════════════════════════════════════════════
// CHAT
// ══════════════════════════════════════════════
function renderChatTab(){
  if(!chatMsgs.length){
    chatMsgs=[{r:'bot',t:'¡Hola! Soy tu asistente de plomería. Preguntame sobre canillas, sifones, presión de agua, herramientas o cualquier duda de instalaciones.'}];
  }
  const chips=['¿Qué es un sifón?','¿Para qué sirve el teflon?','¿Cómo destapo un caño?','Poca presión de agua'];
  document.getElementById('mp-body').innerHTML=`
    <div class="chat-wrap">
      <div class="chat-chips">${chips.map(c=>`<span class="chat-chip" onclick="chatQuick(this)">${c}</span>`).join('')}</div>
      <div class="chat-msgs" id="chat-msgs">${chatMsgs.map(m=>`<div class="chat-msg ${m.r}">${m.t}</div>`).join('')}</div>
      <div class="chat-row">
        <input class="chat-input" id="chat-inp" placeholder="Preguntá sobre plomería..." onkeydown="if(event.key==='Enter')chatSend()">
        <button class="chat-send" onclick="chatSend()">▶</button>
      </div>
    </div>`;
  const msgs=document.getElementById('chat-msgs');
  if(msgs) msgs.scrollTop=msgs.scrollHeight;
}

function chatQuick(el){
  const inp=document.getElementById('chat-inp');
  if(inp){inp.value=el.textContent;chatSend();}
}

async function chatSend(){
  const inp=document.getElementById('chat-inp');if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  inp.value='';
  chatMsgs.push({r:'user',t:txt});
  chatMsgs.push({r:'bot typing',t:'...'});
  renderChatTab();
  const lower=txt.toLowerCase();
  const hit=FAQ.find(f=>lower.includes(f.q));
  if(hit){
    chatMsgs.pop();chatMsgs.push({r:'bot',t:hit.a});renderChatTab();return;
  }
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt,program:'hogar'})});
    const data=await res.json();
    chatMsgs.pop();
    chatMsgs.push({r:'bot',t:data.reply||'No pude responder. Intentá de nuevo.'});
  }catch(e){
    chatMsgs.pop();
    chatMsgs.push({r:'bot',t:'Sin conexión a la API. Pero puedo responder preguntas básicas — probá con las sugerencias.'});
  }
  renderChatTab();
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function loadScenario(i){
  scn=i;stp=0;sel=null;chatMsgs=[];
  ['0','1','2'].forEach(n=>document.getElementById('sctab-'+n)?.classList.toggle('on',+n===i));
  renderScene();renderInventory();renderMP();
}

function prevStep(){if(stp>0){stp--;renderScene();renderInventory();renderMP();}}
function nextStep(){
  const sc=SCENARIOS[scn];
  if(stp<sc.steps.length){stp++;renderScene();renderInventory();renderMP();}
}

function setTab(t){
  mpTab=t;['mis','cri','tip','ast'].forEach(id=>document.getElementById('tab-'+id)?.classList.toggle('on',id===t));
  renderMP();
}

function toggleMP(){
  mpMin=!mpMin;
  document.getElementById('bottom').style.maxHeight=mpMin?'62px':'260px';
  document.getElementById('mp-tog').textContent=mpMin?'▲':'▼';
}

function doHint(){
  const sc=SCENARIOS[scn];
  if(stp>=sc.steps.length)return;
  const step=sc.steps[stp];
  if(step.hintEl){
    const el=document.getElementById(step.hintEl);
    if(el){el.classList.remove('hint-pulse');void el.offsetWidth;el.classList.add('hint-pulse');setTimeout(()=>el.classList.remove('hint-pulse'),4000);}
  }
  if(step.tool){
    const invEl=document.getElementById('inv-'+step.tool);
    if(invEl){invEl.classList.remove('hint-pulse');void invEl.offsetWidth;invEl.classList.add('hint-pulse');setTimeout(()=>invEl.classList.remove('hint-pulse'),4000);}
  }
  toast(step.tip,'tip');
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
let fbTimer=null;
function toast(msg,type='tip'){
  const el=document.getElementById('fb');
  el.textContent=msg;
  el.className='show '+(type==='err'?'err':type==='ok'?'ok':'tip');
  clearTimeout(fbTimer);
  fbTimer=setTimeout(()=>{el.className='';},3800);
}
function clearToast(){document.getElementById('fb').className='';}

function xpPop(n,r){
  if(!n)return;
  xp+=n;
  const el=document.getElementById('xpp');
  el.textContent=`+${n} XP — ${r}`;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
  document.getElementById('mp-xp').textContent=xp+' XP';
}
function flash(){
  const f=document.getElementById('fl');f.classList.add('on');
  setTimeout(()=>f.classList.remove('on'),280);
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
loadScenario(0);
</script>
</body>
</html>
